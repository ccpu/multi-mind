# A push to main can create a release. semantic-release reads conventional
# commits, updates the Tauri version files, tags the release, and creates its
# GitHub Release. The platform jobs then attach the generated installers.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      concurrency_group: release-ci-${{ github.run_id }}
    permissions:
      contents: read

  release:
    name: Version and release
    needs: ci
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, '[skip ci]')
      }}
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup project
        uses: pixpilot/github-actions/setup-pnpm-project@v1

      # The exec plugin writes these outputs only when it creates a release.
      - name: Version, tag and release
        id: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build installers
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      app-version: ${{ needs.release.outputs.version }}
    # A called workflow inherits nothing, and an unsigned installer is one the
    # updater will refuse to install.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Attach installers to the release
    needs:
      - release
      - build
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag-name: ${{ needs.release.outputs.tag }}
      app-version: ${{ needs.release.outputs.version }}
