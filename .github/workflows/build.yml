# Builds installers on every supported desktop platform. Release publishing is
# intentionally separate: deploy.yml attaches these artifacts once semantic-release
# has created the tag and GitHub release.

name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      app-version:
        description: Version to stamp into the Tauri manifests before packaging.
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Minisign private key the updater artifacts are signed with.
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Password for that key, empty when it was generated without one.
        required: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple silicon)
            artifact-name: tauri-macos-aarch64
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            label: macOS (Intel)
            artifact-name: tauri-macos-x86_64
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-latest
            label: Linux
            artifact-name: tauri-linux-x86_64
            args: ''
            rust-targets: ''
          - platform: windows-latest
            label: Windows
            artifact-name: tauri-windows-x86_64
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The AppImage produced here only runs on distributions whose glibc is at
      # least as new as the runner's. Pin an older Ubuntu image if you need to
      # support older distributions.
      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup project
        uses: pixpilot/github-actions/setup-pnpm-project@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target
          cache-on-failure: true

      # The release commit is created in an earlier job, so this checkout still
      # needs its version stamped before Tauri names the installers.
      - name: Stamp the app version
        if: inputs.app-version != ''
        run: pnpm exec tauri-version "${{ inputs.app-version }}" --tauri-dir apps/desktop/src-tauri --json apps/desktop/package.json

      # Signed here, not at publish time: the updater verifies each artifact
      # against the public key in tauri.conf.json, and only the bundler can
      # produce the .sig files that verification needs.
      - name: Build installers
        run: pnpm --filter @app/desktop exec tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.rpm*
